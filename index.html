<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AUROMA // FX LAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#000; --panel:#0e0e0e; --panel2:#151015; --pink:#ff179d; --saffron:#FBB917;
    --ink:#f4eef2; --dim:#8c7d87; --line:#2a2230; --radius:14px; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg); color:var(--ink); font-family:'Share Tech Mono', monospace;
    display:flex; flex-direction:column; min-height:100%; overflow-x:hidden;}
  header{display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .brand h1{font-family:'Orbitron', sans-serif; font-weight:800; margin:0; font-size:18px; letter-spacing:3px; color:var(--pink);}
  .brand small{color:var(--saffron); letter-spacing:2px; font-size:11px}
  .controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  button.ctl, label.ctl{font-family:'Share Tech Mono', monospace; font-size:12px; letter-spacing:1px;
    color:var(--ink); background:var(--panel2); border:1px solid var(--pink); padding:9px 15px;
    border-radius:999px; cursor:pointer; text-transform:uppercase; transition:all .15s; user-select:none;}
  button.ctl:hover, label.ctl:hover{ background:var(--pink); color:#000; }
  label.ctl.alt{border-color:var(--saffron)} label.ctl.alt:hover{background:var(--saffron)}
  #file{display:none}
  main{flex:1; display:flex; gap:20px; padding:20px; align-items:flex-start; flex-wrap:wrap}
  .stage{flex:1 1 520px; min-width:300px; display:flex; flex-direction:column; align-items:center; gap:12px}
  .frame{padding:8px; border-radius:var(--radius); border:1px solid var(--pink); background:#000;
    box-shadow:0 0 18px rgba(255,23,157,0.18); max-width:100%;}
  #view{display:block; max-width:100%; height:auto; background:#000; border-radius:8px; touch-action:none; cursor:crosshair;}
  .armed{font-size:12px; letter-spacing:1px; color:var(--dim)} .armed b{color:var(--pink)}
  .legend{flex:0 0 320px; max-width:100%; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
  .legend h2{font-family:'Orbitron', sans-serif; font-size:12px; letter-spacing:2px; color:var(--saffron); margin:0 0 12px; font-weight:600;}
  .keys{display:grid; grid-template-columns:1fr 1fr; gap:7px; max-height:64vh; overflow:auto; padding-right:4px}
  .keys::-webkit-scrollbar{width:8px} .keys::-webkit-scrollbar-thumb{background:var(--line); border-radius:999px}
  .key{display:flex; align-items:center; gap:9px; padding:8px 10px; border:1px solid var(--line);
    border-radius:10px; background:var(--panel2); cursor:pointer; transition:all .12s;}
  .key:hover{border-color:var(--pink)}
  .key .glyph{font-family:'Orbitron', sans-serif; font-weight:800; font-size:14px; color:var(--saffron); width:20px; text-align:center; flex:0 0 20px;}
  .key .nm{font-size:11px; color:var(--ink); letter-spacing:.3px; line-height:1.1}
  .key.active{ border-color:var(--pink); background:rgba(255,23,157,0.18); } .key.active .glyph{color:#fff}
  .hint{margin-top:14px; font-size:11px; color:var(--dim); line-height:1.7}
  .hint kbd{color:var(--saffron); border:1px solid var(--line); padding:1px 6px; border-radius:6px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>AUROMA // FX LAB</h1>
    <small>PIXEL SORT — THRESHOLD-ON-DRAG</small>
  </div>
  <div class="controls">
    <label class="ctl alt" for="file">Upload</label>
    <input id="file" type="file" accept="image/*">
    <button class="ctl" id="resetBtn">Reset</button>
  </div>
</header>

<main>
  <section class="stage">
    <div class="frame"><canvas id="view" width="760" height="620"></canvas></div>
    <div class="armed">ARMED: <b id="armedOut">none</b></div>
  </section>

  <aside class="legend">
    <h2>EFFECTS — PRESS A KEY OR CLICK</h2>
    <div class="keys" id="keys"></div>
    <div class="hint">
      Arm an effect, then <b>drag slowly across the canvas</b>. The sort threshold rises &amp; falls as you
      move, so the landscape shifts along your stroke. Each variant modulates it differently.
      <kbd>Esc</kbd> disarms.
    </div>
  </aside>
</main>

<script>
/* ===========================================================================
   AUROMA FX LAB — THRESHOLD-ON-DRAG pixel sort
   ---------------------------------------------------------------------------
   The brush IS the threshold control. As you drag, the harness updates a live
   DRAG state and each effect maps it to a sort threshold, so the landscape
   character evolves along the stroke. No sliders — the modulation law is baked
   into each effect (that's the experiment).

       DRAG = { d:distance px, t:ms since stroke start, speed:px/ms,
                ux,uy:drag dir, nx,ny:cursor pos 0..1 }

   Effect signature (applied to the brush box region): fn(p, w, h, t, dir)
   Kept: G Hue sort, M Vert slice tear, Z Datamosh blocks.
   =========================================================================== */

let DRAG = { d:0, t:0, speed:0, ux:0, uy:-1, nx:0.5, ny:0.5 };

const hash1 = (n)=>{ const s=Math.sin(n*127.1)*43758.5453; return s-Math.floor(s); };
const lum   = (r,g,b)=>0.299*r+0.587*g+0.114*b;
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
function hueOf(r,g,b){ const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; if(d===0)return 0;
  let hh; if(mx===r)hh=((g-b)/d)%6; else if(mx===g)hh=(b-r)/d+2; else hh=(r-g)/d+4; hh*=60; if(hh<0)hh+=360; return hh; }
function keyVal(key,r,g,b){
  if(key==='hue') return hueOf(r,g,b);
  if(key==='sat'){ const mx=Math.max(r,g,b),mn=Math.min(r,g,b); return mx===0?0:(mx-mn)/mx*255; }
  if(key==='r') return r; if(key==='g') return g; if(key==='b') return b; return lum(r,g,b);
}
function sortLine(p,w,h,i,vert,thr,dir,key,mode,win){
  const len=vert?h:w, idx=vert?(j)=>((j*w+i)*4):(j)=>((i*w+j)*4);
  const inRun=(L)=> mode==='dark'?L<thr: mode==='window'?(L>=thr&&L<=thr+win): L>thr;
  let j=0;
  while(j<len){
    while(j<len){ const k=idx(j); if(inRun(lum(p[k],p[k+1],p[k+2]))) break; j++; } const s=j;
    while(j<len){ const k=idx(j); if(!inRun(lum(p[k],p[k+1],p[k+2]))) break; j++; } const e=j;
    if(e-s>1){ const a=[];
      for(let q=s;q<e;q++){ const k=idx(q); a.push([p[k],p[k+1],p[k+2],p[k+3]]); }
      a.sort((u,v)=>dir*(keyVal(key,u[0],u[1],u[2])-keyVal(key,v[0],v[1],v[2])));
      for(let q=0;q<a.length;q++){ const k=idx(s+q),c=a[q]; p[k]=c[0];p[k+1]=c[1];p[k+2]=c[2];p[k+3]=c[3]; }
    }
  }
}
function sortLineDelta(p,w,h,i,vert,dthr,dir,key){
  const len=vert?h:w, idx=vert?(j)=>((j*w+i)*4):(j)=>((i*w+j)*4);
  const kv=(j)=>{ const k=idx(j); return keyVal(key,p[k],p[k+1],p[k+2]); };
  let s=0;
  for(let j=1;j<=len;j++){
    if(j===len || Math.abs(kv(j)-kv(j-1))>dthr){
      if(j-s>1){ const a=[];
        for(let q=s;q<j;q++){ const k=idx(q); a.push([p[k],p[k+1],p[k+2],p[k+3]]); }
        a.sort((u,v)=>dir*(keyVal(key,u[0],u[1],u[2])-keyVal(key,v[0],v[1],v[2])));
        for(let q=0;q<a.length;q++){ const k=idx(s+q),c=a[q]; p[k]=c[0];p[k+1]=c[1];p[k+2]=c[2];p[k+3]=c[3]; }
      }
      s=j;
    }
  }
}
function pixelSort(p,w,h,o){ const vert=o.axis!=='h', lines=vert?w:h;
  for(let i=0;i<lines;i++) sortLine(p,w,h,i,vert,o.threshold,o.dir||1,o.key||'lum',o.mode||'bright',o.win||60); }
function sliceShift(p,w,h,t,bands,amp,horizontal){
  const src=p.slice(), span=horizontal?h:w, bs=Math.ceil(span/bands);
  for(let b=0;b<bands;b++){ const off=Math.round((hash1(b*7.13+Math.floor(t/110)*3.1)-0.5)*amp*2);
    if(horizontal){ for(let y=b*bs;y<Math.min(h,(b+1)*bs);y++) for(let x=0;x<w;x++){ const sx=((x+off)%w+w)%w,di=(y*w+x)*4,si=(y*w+sx)*4; p[di]=src[si];p[di+1]=src[si+1];p[di+2]=src[si+2];p[di+3]=src[si+3]; } }
    else { for(let x=b*bs;x<Math.min(w,(b+1)*bs);x++) for(let y=0;y<h;y++){ const sy=((y+off)%h+h)%h,di=(y*w+x)*4,si=(sy*w+x)*4; p[di]=src[si];p[di+1]=src[si+1];p[di+2]=src[si+2];p[di+3]=src[si+3]; } } } }

/* MS: pixel-sort whose threshold comes from a drag->threshold law thrFn(DRAG) */
const MS = (thrFn, opts={}) => (p,w,h)=>{ const thr=clamp(thrFn(DRAG),0,255);
  pixelSort(p,w,h, Object.assign({axis:'v',dir:1,key:'lum',mode:'bright',win:60,threshold:thr}, opts)); };

/* ---- 26 effects ---- */
const FX = {
  /* distance-driven (slow rise/fall as you travel) */
  a: { name:'Ramp↑ (travel)',  fn:MS(D=>Math.min(255, D.d*0.25)) },
  b: { name:'Ramp wrap',       fn:MS(D=>(D.d*0.25)%256) },
  c: { name:'Ramp↓ (travel)',  fn:MS(D=>Math.max(0, 240 - D.d*0.25)) },
  d: { name:'Sine (travel)',   fn:MS(D=>128 + 115*Math.sin(D.d*0.006)) },
  e: { name:'Triangle',        fn:MS(D=>{ const ph=(D.d*0.002)%2; return 255*(ph<1?ph:2-ph); }) },
  f: { name:'Sawtooth',        fn:MS(D=>(D.d*0.35)%256) },

  g: { name:'Hue sort', fn:(p,w,h)=>{ for(let x=0;x<w;x++){ const a=[];
        for(let y=0;y<h;y++){ const i=(y*w+x)*4; a.push([p[i],p[i+1],p[i+2]]); }
        a.sort((u,v)=>hueOf(u[0],u[1],u[2])-hueOf(v[0],v[1],v[2]));
        for(let y=0;y<h;y++){ const i=(y*w+x)*4,c=a[y]; p[i]=c[0];p[i+1]=c[1];p[i+2]=c[2]; } } } },

  /* time-driven */
  h: { name:'Ramp↑ (time)',    fn:MS(D=>Math.min(255, D.t*0.12)) },
  i: { name:'Sine (time)',     fn:MS(D=>128 + 115*Math.sin(D.t*0.0016)) },
  /* gesture-driven */
  j: { name:'By speed',        fn:MS(D=>clamp(D.speed*120,0,255)) },
  k: { name:'By Y position',   fn:MS(D=>D.ny*255) },
  l: { name:'By X position',   fn:MS(D=>D.nx*255) },

  m: { name:'Vert slice tear', fn:(p,w,h,t)=>sliceShift(p,w,h,t,18,h*0.25,false) },

  /* compound oscillations */
  n: { name:'Drift (wander)',  fn:MS(D=>128 + 90*Math.sin(D.d*0.004) + 40*Math.sin(D.d*0.0017+1.3)) },
  o: { name:'Double sine',     fn:MS(D=>128 + 80*Math.sin(D.d*0.006) + 45*Math.sin(D.d*0.018)) },
  p: { name:'Pulse',           fn:MS(D=>(Math.sin(D.d*0.01)>0.6 ? 220 : 50)) },
  q: { name:'Ramp + jitter',   fn:(p,w,h)=>{ const base=Math.min(255,DRAG.d*0.25);
        for(let x=0;x<w;x++){ const tj=clamp(base+(hash1(x*3.1)-0.5)*50,0,255); sortLine(p,w,h,x,true,tj,1,'lum','bright',60); } } },

  /* same modulation, different sort target */
  r: { name:'Sine valleys',    fn:MS(D=>128 + 115*Math.sin(D.d*0.006), {mode:'dark'}) },
  s: { name:'Sine horiz',      fn:MS(D=>128 + 115*Math.sin(D.d*0.006), {axis:'h'}) },
  t: { name:'Ramp red',        fn:MS(D=>Math.min(255,D.d*0.25), {key:'r'}) },
  u: { name:'Sine blue',       fn:MS(D=>128 + 115*Math.sin(D.d*0.006), {key:'b'}) },
  v: { name:'Ramp window',     fn:MS(D=>Math.min(255,D.d*0.25), {mode:'window',win:80}) },

  w: { name:'Sine mirror',     fn:(p,w,h)=>{ const thr=clamp(128+115*Math.sin(DRAG.d*0.006),0,255);
        pixelSort(p,w,h,{axis:'v',dir:1,threshold:thr});
        for(let x=0;x<w;x++) for(let y=Math.floor(h/2);y<h;y++){ const di=(y*w+x)*4,si=((h-1-y)*w+x)*4; p[di]=p[si];p[di+1]=p[si+1];p[di+2]=p[si+2]; } } },

  x: { name:'By direction',    fn:MS(D=>Math.abs(D.uy)*255) },

  y: { name:'Ramp edges',      fn:(p,w,h)=>{ const dt=clamp(8+DRAG.d*0.06,4,120); for(let x=0;x<w;x++) sortLineDelta(p,w,h,x,true,dt,1,'lum'); } },

  z: { name:'Datamosh blocks', fn:(p,w,h,t)=>{ const src=p.slice(); const bs=14;
        for(let by=0;by<h;by+=bs) for(let bx=0;bx<w;bx+=bs){
          if(hash1(bx*1.3+by*2.7+Math.floor(t/120))<0.68) continue;
          const ox=Math.round((hash1(bx+by)-0.5)*bs*1.6), oy=Math.round((hash1(by-bx)-0.5)*bs*1.6);
          for(let y=by;y<Math.min(h,by+bs);y++) for(let x=bx;x<Math.min(w,bx+bs);x++){
            const sx=clamp(x+ox,0,w-1), sy=clamp(y+oy,0,h-1), di=(y*w+x)*4, si=(sy*w+sx)*4;
            p[di]=src[si];p[di+1]=src[si+1];p[di+2]=src[si+2];
          } } } },
};

/* ============================ harness ============================ */
const MAXDIM = 900;
const view=document.getElementById('view'), vctx=view.getContext('2d',{willReadFrequently:true});
const base=document.createElement('canvas'), bctx=base.getContext('2d',{willReadFrequently:true});
let armed=null, brushSize=150, drawing=false, lastPt=null, dir={ux:0,uy:-1}, loadedURL=null;
let strokeStart=0, strokeDist=0, lastMoveT=0;
const order=Object.keys(FX);
const keysEl=document.getElementById('keys'), armedOut=document.getElementById('armedOut');

order.forEach(letter=>{ const el=document.createElement('div'); el.className='key'; el.dataset.k=letter;
  el.innerHTML=`<span class="glyph">${letter.toUpperCase()}</span><span class="nm">${FX[letter].name}</span>`;
  el.addEventListener('click',()=>arm(letter)); keysEl.appendChild(el); });
function arm(letter){ armed=(armed===letter)?null:letter;
  order.forEach(l=>keysEl.querySelector(`[data-k="${l}"]`).classList.toggle('active', l===armed));
  armedOut.textContent=armed?`${armed.toUpperCase()} · ${FX[armed].name}`:'none'; }

function defaultFill(){
  const w=760,h=620; view.width=w; view.height=h;
  const g=vctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#ffd9a8'); g.addColorStop(.4,'#ff8fb6'); g.addColorStop(.7,'#c9a6e0'); g.addColorStop(1,'#7fe3da');
  vctx.fillStyle=g; vctx.fillRect(0,0,w,h);
  const id=vctx.getImageData(0,0,w,h), d=id.data;
  for(let k=0;k<d.length;k+=4){ const n=(Math.random()-0.5)*70; d[k]+=n; d[k+1]+=n; d[k+2]+=n; }
  vctx.putImageData(id,0,0); snapshotBase();
}
function snapshotBase(){ base.width=view.width; base.height=view.height; bctx.clearRect(0,0,base.width,base.height); bctx.drawImage(view,0,0); }
function resetCanvas(){ armed=null; order.forEach(l=>keysEl.querySelector(`[data-k="${l}"]`).classList.remove('active')); armedOut.textContent='none';
  if(loadedURL) loadImage(loadedURL); else defaultFill(); }
function loadImage(url){ loadedURL=url; const img=new Image();
  img.onload=()=>{ const s=Math.min(1,MAXDIM/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.max(1,Math.round(img.naturalWidth*s)),h=Math.max(1,Math.round(img.naturalHeight*s));
    view.width=w; view.height=h; vctx.drawImage(img,0,0,w,h); snapshotBase(); };
  img.src=url; }

/* box-drag brush: applies armed effect to the region under the box along the stroke */
function applyAt(px,py){ if(!armed) return;
  const w=view.width,h=view.height,r=brushSize/2;
  const x0=Math.max(0,Math.round(px-r)),y0=Math.max(0,Math.round(py-r));
  const x1=Math.min(w,Math.round(px+r)),y1=Math.min(h,Math.round(py+r));
  const bw=x1-x0,bh=y1-y0; if(bw<=0||bh<=0) return;
  const region=vctx.getImageData(x0,y0,bw,bh);
  FX[armed].fn(region.data,bw,bh,performance.now(),dir);
  vctx.putImageData(region,x0,y0); }
function posFromEvent(e){ const rect=view.getBoundingClientRect(), s=e.touches&&e.touches[0]?e.touches[0]:e;
  return { x:(s.clientX-rect.left)*(view.width/rect.width), y:(s.clientY-rect.top)*(view.height/rect.height) }; }
function strokeTo(pt){ const now=performance.now();
  const dx=pt.x-lastPt.x, dy=pt.y-lastPt.y, dist=Math.hypot(dx,dy);
  if(dist>0){ dir={ux:dx/dist,uy:dy/dist}; DRAG.ux=dir.ux; DRAG.uy=dir.uy; }
  const dt=Math.max(1, now-lastMoveT), inst=dist/dt; DRAG.speed=DRAG.speed*0.6+inst*0.4;  // smoothed px/ms
  const spacing=Math.max(2,brushSize*0.4), steps=Math.max(1,Math.floor(dist/spacing)), stepLen=dist/steps;
  for(let i=1;i<=steps;i++){ const sx=lastPt.x+dx*(i/steps), sy=lastPt.y+dy*(i/steps);
    strokeDist+=stepLen; DRAG.d=strokeDist; DRAG.t=now-strokeStart; DRAG.nx=sx/view.width; DRAG.ny=sy/view.height;
    applyAt(sx,sy); }
  lastMoveT=now; lastPt=pt; }
function down(e){ if(!armed) return; e.preventDefault(); drawing=true; const pt=posFromEvent(e); lastPt=pt;
  strokeStart=performance.now(); strokeDist=0; lastMoveT=strokeStart;
  DRAG.d=0; DRAG.t=0; DRAG.speed=0; DRAG.nx=pt.x/view.width; DRAG.ny=pt.y/view.height;
  applyAt(pt.x,pt.y); }
function move(e){ if(!drawing) return; e.preventDefault(); strokeTo(posFromEvent(e)); }
function up(){ drawing=false; lastPt=null; }
view.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
view.addEventListener('touchstart',down,{passive:false}); view.addEventListener('touchmove',move,{passive:false}); view.addEventListener('touchend',up);

document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){ if(armed) arm(armed); return; }
  const k=e.key.toLowerCase(); if(FX[k]){ e.preventDefault(); arm(k); }
});
document.getElementById('file').addEventListener('change',(e)=>{ const f=e.target.files[0]; if(f) loadImage(URL.createObjectURL(f)); });
document.getElementById('resetBtn').addEventListener('click',resetCanvas);
defaultFill();
</script>
</body>
</html>
